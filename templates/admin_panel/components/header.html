    <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 md:px-7 h-16 flex items-center gap-4 shrink-0">
      <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors">
        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <span class="text-xs font-semibold text-gray-700 hidden sm:block">Panneau d'administration système</span>

      <div class="flex items-center gap-1.5 ml-auto">
        <button class="relative p-2 rounded-xl hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
        </button>
        <button class="p-2 rounded-xl hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3m.08 4h.01"/>
          </svg>
        </button>
        <!-- Avatar + dropdown -->
        <div class="relative ml-1" id="profile-menu-top">
          <button onclick="toggleProfileTop()" class="w-8 h-8 rounded-full bg-primary-light text-primary text-[10px] font-semibold flex items-center justify-center cursor-pointer ring-2 ring-transparent hover:ring-primary/30 transition-all select-none">
            {{ user.first_name|slice:":1"|upper }}{{ user.last_name|slice:":1"|upper }}
          </button>

          <!-- Dropdown popup -->
          <div id="profile-dropdown-top"
            class="hidden absolute right-0 top-[calc(100%+8px)] w-52 bg-white border border-gray-100 rounded-xl shadow-lg shadow-black/8 z-50 overflow-hidden">
            <div class="px-4 py-3 border-b border-gray-50">
              <p class="text-xs font-semibold text-gray-800 truncate">{{ user.first_name }} {{ user.last_name }}</p>
              <p class="text-[10px] text-gray-400 truncate mt-0.5">{{ user.email }}</p>
              <span class="mt-2 inline-flex items-center text-[9px] font-semibold bg-primary-light text-primary px-2 py-0.5 rounded-full uppercase tracking-wide">Administrateur</span>
            </div>
            <div class="py-1.5">
              <a href="#" class="flex items-center gap-2.5 px-4 py-2 text-[11px] text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
                Configurations
              </a>
            </div>
            <div class="border-t border-gray-50 py-1.5">
              <a href="{% url 'logout' %}" class="flex items-center gap-2.5 px-4 py-2 text-[11px] text-red-500 hover:bg-red-50 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Se déconnecter
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>
